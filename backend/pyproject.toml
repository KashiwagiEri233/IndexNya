[project]
name = "learning-agent-backend"
version = "0.1.0"
description = "多智能体个性化学习资源生成系统 — 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "python-pptx>=0.6.23",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "markdown>=3.6",
    "weasyprint>=62 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
